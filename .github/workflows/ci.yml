
name: Customer 360 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: SpringBoot/pom.xml

      - name: Build Spring Boot
        working-directory: SpringBoot
        run: mvn -B -DskipTests package

  frontend:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Frontend/customer360-frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/customer360-frontend
        run: npm ci

      - name: Build React
        working-directory: Frontend/customer360-frontend
        run: npm run build
